<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ page.title | default: site.title | escape }}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0 auto; max-width: 42rem; padding: 3rem 1.25rem; line-height: 1.65; color: #18212b; background: #f7f8fb; }
    main { background: white; padding: 2rem; border: 1px solid #e2e6ed; border-radius: 1rem; }
    h1 { line-height: 1.2; }
    a { color: #1557b0; }
  </style>
</head>
<body><main>{{ content }}</main></body>
</html>
