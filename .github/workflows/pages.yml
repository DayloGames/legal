name: Publish legal site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unfinished final documents
        run: |
          for dir in site/es site/en; do
            if [ -d "$dir" ] && grep -R -n -E --include='*.md' '\[PENDIENTE:|BORRADOR|no vigente' "$dir"; then
              echo "Unfinished final content found in $dir"
              exit 1
            fi
          done
      - name: Generate labeled draft previews
        run: python3 scripts/build-preview.py
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
